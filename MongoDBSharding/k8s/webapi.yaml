apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapi
  template:
    metadata:
      labels:
        app: webapi
    spec:
      initContainers:
        - name: wait-for-setup
          image: mongo:latest
          command:
            - bash
            - -c
            - |
              until mongosh --host mongos --port 15564 --quiet --eval "if (db.getSiblingDB('admin').runCommand({ listShards: 1 }).shards.length < 3) throw 'waiting';" &>/dev/null; do
                sleep 2
              done
      containers:
        - name: webapi
          image: webapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: webapi
spec:
  type: LoadBalancer
  ports:
    - port: 8080
  selector:
    app: webapi
