apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapi-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-watcher-role
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapi-job-watcher-binding
subjects:
  - kind: ServiceAccount
    name: webapi-sa
roleRef:
  kind: Role
  name: job-watcher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi
spec:
  selector:
    matchLabels:
      app: webapi
  template:
    metadata:
      labels:
        app: webapi
    spec:
      serviceAccountName: webapi-sa
      initContainers:
        - name: wait-for-setup-job
          image: bitnami/kubectl:latest
          command:
            - "kubectl"
            - "wait"
            - "--for=condition=complete"
            - "--timeout=120s"
            - "job/mongodb-setup"
      containers:
        - name: webapi
          image: webapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: webapi
spec:
  type: LoadBalancer
  ports:
    - port: 8080
  selector:
    app: webapi
