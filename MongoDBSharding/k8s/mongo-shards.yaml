apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard1
spec:
  serviceName: shard1-headless
  replicas: 3
  selector:
    matchLabels:
      app: shard1
  template:
    metadata:
      labels:
        app: shard1
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: mongo
          image: mongo:latest
          command: [mongod, --shardsvr, --replSet, shard1ReplSet, --port, "15562", --bind_ip_all]
          ports:
            - containerPort: 15562
          lifecycle:
            preStop:
              exec:
                command:
                  - bash
                  - -c
                  - |
                    [ "$(hostname)" = "shard1-0" ] && exit 0
                    PRIMARY=$(mongosh --host shard1-0.shard1-headless --port 15562 --quiet --eval "db.hello().primary" 2>/dev/null)
                    [ -n "$PRIMARY" ] && mongosh --host "$PRIMARY" --eval "rs.remove('$(hostname).shard1-headless:15562')"
        - name: sidecar
          image: mongo:latest
          command:
            - bash
            - -c
            - |
              [ "$(hostname)" = "shard1-0" ] && sleep infinity
              until mongosh --port 15562 --eval "db.adminCommand('ping')" &>/dev/null; do sleep 1; done
              while true; do
                PRIMARY=$(mongosh --host shard1-0.shard1-headless --port 15562 --quiet --eval "db.hello().primary" 2>/dev/null)
                [ -n "$PRIMARY" ] && mongosh --host "$PRIMARY" --eval "
                  if (rs.status().members.some(m => m.name === '$(hostname).shard1-headless:15562')) quit(0);
                  if (rs.add('$(hostname).shard1-headless:15562').ok) quit(0);
                  quit(1);
                " && sleep infinity
                sleep 5
              done
---
apiVersion: v1
kind: Service
metadata:
  name: shard1-headless
spec:
  clusterIP: None
  ports:
    - port: 15562
  selector:
    app: shard1
---
