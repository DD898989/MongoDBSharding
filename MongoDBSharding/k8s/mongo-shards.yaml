apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shard1
  labels:
    app: shard1
spec:
  serviceName: shard1-headless
  replicas: 3
  selector:
    matchLabels:
      app: shard1
  template:
    metadata:
      labels:
        app: shard1
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongo
          image: mongo:latest
          command:
            - mongod
            - --shardsvr
            - --replSet
            - shard1ReplSet
            - --port
            - "15562"
            - --bind_ip_all
          ports:
            - containerPort: 15562
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          lifecycle:
            preStop:
              exec:
                command:
                  - bash
                  - -c
                  - |
                    if [ "$(hostname)" != "shard1-0" ]; then
                      echo "Removing myself from replica set..."
                      PRIMARY=$(mongosh --host shard1-0.shard1-headless --port 15562 --quiet --eval "db.hello().primary" 2>/dev/null)
                      if [ ! -z "$PRIMARY" ]; then
                        mongosh --host "$PRIMARY" --eval "rs.remove('$(hostname).shard1-headless:15562')"
                      fi
                    fi
        - name: sidecar
          image: mongo:latest
          command:
            - bash
            - -c
            - |
              if [ "$(hostname)" = "shard1-0" ]; then
                echo "Bootstrap node (shard1-0). Skipping auto-join."
                sleep infinity
              fi
              echo "Waiting for local MongoDB (port 15562) to be ready..."
              until mongosh --port 15562 --eval "db.adminCommand('ping')" &>/dev/null; do
                sleep 1
              done
              echo "Local MongoDB is ready. Waiting for replica set primary to be active..."
              while true; do
                PRIMARY=$(mongosh --host shard1-0.shard1-headless --port 15562 --quiet --eval "db.hello().primary" 2>/dev/null)
                if [ ! -z "$PRIMARY" ]; then
                  echo "Found primary: $PRIMARY"
                  IS_MEMBER=$(mongosh --host "$PRIMARY" --quiet --eval "rs.status().members.some(m => m.name === '$(hostname).shard1-headless:15562')" 2>/dev/null)
                  if [ "$IS_MEMBER" = "true" ]; then
                    echo "Already a member. Going to sleep."
                    sleep infinity
                  elif [ "$IS_MEMBER" = "false" ]; then
                    echo "Adding myself to replica set..."
                    mongosh --host "$PRIMARY" --eval "rs.add('$(hostname).shard1-headless:15562')"
                    if [ $? -eq 0 ]; then
                      echo "Successfully joined replica set!"
                      sleep infinity
                    fi
                  fi
                fi
                sleep 5
              done
---
apiVersion: v1
kind: Service
metadata:
  name: shard1
spec:
  type: LoadBalancer
  ports:
    - name: ext-port
      port: 27018
      targetPort: 15562
    - name: int-port
      port: 15562
      targetPort: 15562
  selector:
    app: shard1
---
apiVersion: v1
kind: Service
metadata:
  name: shard1-headless
spec:
  clusterIP: None
  ports:
    - name: int-port
      port: 15562
      targetPort: 15562
  selector:
    app: shard1
---
