apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydefault
  labels:
    app: mydefault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mydefault
  template:
    metadata:
      labels:
        app: mydefault
    spec:
      containers:
        - name: mongo
          image: mongo:latest
          command:
            - mongod
            - --shardsvr
            - --replSet
            - mydefaultReplSet
            - --port
            - "15565"
            - --bind_ip_all
          ports:
            - containerPort: 15565
---
apiVersion: v1
kind: Service
metadata:
  name: mydefault
spec:
  type: LoadBalancer
  ports:
    - name: ext-port
      port: 27020
      targetPort: 15565
    - name: int-port
      port: 15565
      targetPort: 15565
  selector:
    app: mydefault
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shard1-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: shard1
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
apiVersion: autoscaling/v2
