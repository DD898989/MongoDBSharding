apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-setup
spec:
  template:
    spec:
      containers:
        - name: setup
          image: mongo:latest
          command:
            - bash
            - -e
            - -c
            - |
              init_rs() {
                local host=$1; local port=$2; local rs_id=$3; local is_config=$4
                echo "==== Waiting for $host to be ready ===="
                until mongosh --host $host --port $port --eval "db.adminCommand('ping')" &>/dev/null; do sleep 1; done
                echo "==== Initializing $rs_id replica set ===="
                local cfg="{ _id: '$rs_id', members: [{ _id: 0, host: '$host:$port' }] }"
                if [ "$is_config" = "true" ]; then
                  cfg="{ _id: '$rs_id', configsvr: true, members: [{ _id: 0, host: '$host:$port' }] }"
                fi
                mongosh --host $host --port $port --eval "try { rs.status(); } catch(e) { rs.initiate($cfg); }"
              }

              init_rs configsvr 15561 configReplSet true
              init_rs shard1-0.shard1-headless 15562 shard1ReplSet false
              init_rs shard2-0.shard2-headless 15563 shard2ReplSet false
              init_rs mydefault 15565 mydefaultReplSet false

              echo "==== Waiting for mongos to be ready ===="
              until mongosh --host mongos --port 15564 --eval "db.adminCommand('ping')" &>/dev/null; do sleep 1; done
              
              echo "==== Adding shards and enabling sharding via mongos ===="
              mongosh --host mongos --port 15564 --eval '
                function addShardSafe(shardConn) {
                  try { sh.addShard(shardConn); } catch (e) { if (!e.message.includes("already")) throw e; }
                }
                addShardSafe("shard1ReplSet/shard1-0.shard1-headless:15562");
                addShardSafe("shard2ReplSet/shard2-0.shard2-headless:15563");
                addShardSafe("mydefaultReplSet/mydefault:15565");
                
                db = db.getSiblingDB("ShardingDb");
                try { sh.enableSharding("ShardingDb"); } catch (e) { if (!e.message.includes("already")) throw e; }
                try { db.getSiblingDB("admin").runCommand({ movePrimary: "ShardingDb", to: "mydefaultReplSet" }); } catch (e) { if (!e.message.includes("already")) throw e; }
                try {
                  sh.addShardToZone("shard1ReplSet", "my_zone");
                  sh.addShardToZone("shard2ReplSet", "my_zone");
                } catch (e) { if (!e.message.includes("already")) throw e; }
              '
              echo "==== MongoDB Sharding Setup Completed successfully! ===="
      restartPolicy: OnFailure
  backoffLimit: 4
